name: byte-v-forge

x-n8n-environment: &n8n-environment
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: n8n-postgres
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n
  DB_POSTGRESDB_PASSWORD: ${N8N_POSTGRES_PASSWORD:-byte_v_forge_n8n}
  DB_TABLE_PREFIX: n8n_
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: n8n-redis
  QUEUE_BULL_REDIS_PORT: "6379"
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-byte_v_forge_n8n_encryption_key_change_me_32}
  N8N_EDITOR_BASE_URL: ${N8N_PUBLIC_URL:-http://localhost:5678}
  WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:8081/}
  N8N_PROXY_HOPS: "1"
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
  N8N_SECURE_COOKIE: "false"
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  N8N_TEMPLATES_ENABLED: "false"
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
  GPT_ACTION_API_BASE_URL: ${GPT_ACTION_API_BASE_URL:-http://gpt-service:8080/api/gpt/actions}
  GOPAY_ACTION_API_BASE_URL: ${GOPAY_ACTION_API_BASE_URL:-http://gopay-app:8080/api/gopay/actions}
  GOPAY_API_BASE_URL: ${GOPAY_API_BASE_URL:-http://gopay-app:8080/api/gopay}
  WA_ACTION_API_BASE_URL: ${WA_ACTION_API_BASE_URL:-http://wa-app-service:8080/api/wa/actions}
  WA_API_BASE_URL: ${WA_API_BASE_URL:-http://wa-app-service:8080/api/wa}
  SMS_API_BASE_URL: ${SMS_API_BASE_URL:-http://sms-service:8080/api/sms}
  PROXY_RUNTIME_API_BASE_URL: ${PROXY_RUNTIME_API_BASE_URL:-http://proxy-runtime:8080/api}
  WORKFLOW_RUNTIME_API_BASE_URL: ${WORKFLOW_RUNTIME_API_BASE_URL:-http://workflow-runtime:8080/api/workflow-runtime}
  WORKFLOW_RUNTIME_STEP_UPDATE_TOKEN: ${WORKFLOW_RUNTIME_STEP_UPDATE_TOKEN:-byte_v_forge_workflow_runtime_step_update_token_change_me_32}
  N8N_INSTANCE_OWNER_MANAGED_BY_ENV: "true"
  N8N_INSTANCE_OWNER_EMAIL: ${N8N_INSTANCE_OWNER_EMAIL:-byte-v-forge@byte-v-forge.local}
  N8N_INSTANCE_OWNER_FIRST_NAME: ${N8N_INSTANCE_OWNER_FIRST_NAME:-Byte}
  N8N_INSTANCE_OWNER_LAST_NAME: ${N8N_INSTANCE_OWNER_LAST_NAME:-Forge}
  N8N_INSTANCE_OWNER_PASSWORD_HASH: ${N8N_INSTANCE_OWNER_PASSWORD_HASH:-$$2b$$10$$j6/JtPvAKtGGGMVOTqIQrOaq3b0.fQyK46ZWQdNN4E4e496n5ToYq}

x-n8n-runner-environment: &n8n-runner-environment
  N8N_RUNNERS_MODE: external
  N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
  N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:-byte_v_forge_n8n_runner_auth_token_change_me_32}
  N8N_NATIVE_PYTHON_RUNNER: "true"

x-n8n-task-runner-environment: &n8n-task-runner-environment
  N8N_RUNNERS_TASK_BROKER_URI: http://n8n-worker:5679
  N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:-byte_v_forge_n8n_runner_auth_token_change_me_32}
  N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: "0"
  N8N_RUNNERS_MAX_CONCURRENCY: "5"
  N8N_RUNNERS_LAUNCHER_HEALTH_CHECK_PORT: "5680"
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
  GPT_ACTION_API_BASE_URL: ${GPT_ACTION_API_BASE_URL:-http://gpt-service:8080/api/gpt/actions}
  GOPAY_ACTION_API_BASE_URL: ${GOPAY_ACTION_API_BASE_URL:-http://gopay-app:8080/api/gopay/actions}
  GOPAY_API_BASE_URL: ${GOPAY_API_BASE_URL:-http://gopay-app:8080/api/gopay}
  WA_ACTION_API_BASE_URL: ${WA_ACTION_API_BASE_URL:-http://wa-app-service:8080/api/wa/actions}
  WA_API_BASE_URL: ${WA_API_BASE_URL:-http://wa-app-service:8080/api/wa}
  SMS_API_BASE_URL: ${SMS_API_BASE_URL:-http://sms-service:8080/api/sms}
  PROXY_RUNTIME_API_BASE_URL: ${PROXY_RUNTIME_API_BASE_URL:-http://proxy-runtime:8080/api}
  WORKFLOW_RUNTIME_API_BASE_URL: ${WORKFLOW_RUNTIME_API_BASE_URL:-http://workflow-runtime:8080/api/workflow-runtime}
  WORKFLOW_RUNTIME_STEP_UPDATE_TOKEN: ${WORKFLOW_RUNTIME_STEP_UPDATE_TOKEN:-byte_v_forge_workflow_runtime_step_update_token_change_me_32}

services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-byte_v_forge}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-byte_v_forge}
      - POSTGRES_DB=${POSTGRES_DB:-byte_v_forge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  traefik:
    image: docker.m.daocloud.io/library/traefik:v3.7.1
    command:
      - --api=true
      - --api.insecure=true
      - --ping=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.webhook.address=:8081
      - --entrypoints.internal.address=:9000
    ports:
      - "${WEBUI_PORT:-8080}:80"
      - "${WEBHOOK_PORT:-8081}:8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: always

  n8n-redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: always

  n8n-postgres:
    image: docker.m.daocloud.io/library/postgres:15-alpine
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${N8N_POSTGRES_PASSWORD:-byte_v_forge_n8n}
      - POSTGRES_DB=n8n
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - n8n_pgdata:/var/lib/postgresql/data
    restart: always

  platform-redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: always

  openai-sso-lite:
    build:
      context: ../openai-sso-lite
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${OPENAI_SSO_LITE_HTTP_PORT:-8091}:8080"
    environment:
      - SSO_HTTP_ADDR=:8080
      - SSO_ISSUER=${OPENAI_SSO_LITE_ISSUER:-https://sso.example.invalid}
      - SSO_SQLITE_PATH=/var/lib/openai-sso-lite/openai-sso-lite.db
      - SSO_CLIENT_ID=openai-chatgpt
      - SSO_CLIENT_SECRET=${OPENAI_SSO_LITE_CLIENT_SECRET:-change-me-at-least-32-characters}
      - SSO_ADMIN_TOKEN=${OPENAI_SSO_LITE_ADMIN_TOKEN:-change-me-at-least-32-characters}
      - SSO_RSA_PRIVATE_KEY_B64=${OPENAI_SSO_LITE_RSA_PRIVATE_KEY_B64:-}
      - SSO_ALLOWED_REDIRECT_URI_PREFIXES=${OPENAI_SSO_LITE_ALLOWED_REDIRECT_URI_PREFIXES:-https://external.auth.openai.com/}
    volumes:
      - openai_sso_lite_data:/var/lib/openai-sso-lite
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openai-sso-lite.rule=Host(`openai-sso-lite.byte-v-forge.localhost`) || Host(`sso.uizsdas.bond`)"
      - "traefik.http.routers.openai-sso-lite.entrypoints=web"
      - "traefik.http.routers.openai-sso-lite.priority=600"
      - "traefik.http.routers.openai-sso-lite.service=openai-sso-lite"
      - "traefik.http.services.openai-sso-lite.loadbalancer.server.port=8080"
      - "traefik.http.services.openai-sso-lite.loadbalancer.healthcheck.path=/readyz"
    restart: always

  openai-sso-discord-bot:
    build:
      context: ../openai-sso-discord-bot
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${OPENAI_SSO_DISCORD_BOT_HTTP_PORT:-8092}:8080"
    environment:
      - DISCORD_BOT_TOKEN=${OPENAI_SSO_DISCORD_BOT_TOKEN:-}
      - DISCORD_APPLICATION_ID=${OPENAI_SSO_DISCORD_BOT_APPLICATION_ID:-}
      - DISCORD_GUILD_ID=${OPENAI_SSO_DISCORD_BOT_GUILD_ID:-}
      - DISCORD_SSO_PROXY_URL=${OPENAI_SSO_DISCORD_BOT_PROXY_URL:-}
      - DISCORD_SSO_HTTP_ADDR=:8080
      - DISCORD_SSO_SQLITE_PATH=/var/lib/openai-sso-discord-bot/openai-sso-discord-bot.db
      - SSO_ISSUER=${OPENAI_SSO_LITE_ISSUER:-https://sso.example.invalid}
      - SSO_ADMIN_TOKEN=${OPENAI_SSO_LITE_ADMIN_TOKEN:-change-me-at-least-32-characters}
      - SSO_EMAIL_DOMAIN=${OPENAI_SSO_DISCORD_BOT_EMAIL_DOMAIN:-workspace.example.invalid}
    volumes:
      - openai_sso_discord_bot_data:/var/lib/openai-sso-discord-bot
    restart: always

  team-5000:
    build:
      context: ../team-5000
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${TEAM5000_HTTP_PORT:-8093}:8080"
    environment:
      - TEAM5000_HTTP_ADDR=:8080
      - TEAM5000_DOMAIN=${TEAM5000_DOMAIN:-workspace.example.invalid}
      - TEAM5000_SSO_ISSUER=${OPENAI_SSO_LITE_ISSUER:-https://sso.example.invalid}
      - TEAM5000_SSO_ADMIN_TOKEN=${OPENAI_SSO_LITE_ADMIN_TOKEN:-change-me-at-least-32-characters}
      - TEAM5000_WORKSPACE_ID=${TEAM5000_WORKSPACE_ID:-}
      - TEAM5000_PROXY_URL=${TEAM5000_PROXY_URL:-socks5://proxy-runtime:10810}
      - TEAM5000_MODEL=${TEAM5000_MODEL:-gpt-5.5}
      - TEAM5000_MAX_PARENT_HELLO=${TEAM5000_MAX_PARENT_HELLO:-0}
      - TEAM5000_OUTPUT=/var/lib/team-5000/sessions
      - TEAM5000_REPORT=/var/lib/team-5000/logs/team5000-cycle.jsonl
    volumes:
      - team_5000_data:/var/lib/team-5000
    depends_on:
      - proxy-runtime
      - openai-sso-lite
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.team-5000.rule=PathPrefix(`/api/team-5000`)"
      - "traefik.http.routers.team-5000.entrypoints=web"
      - "traefik.http.routers.team-5000.priority=100"
      - "traefik.http.routers.team-5000.service=team-5000"
      - "traefik.http.services.team-5000.loadbalancer.server.port=8080"
      - "traefik.http.services.team-5000.loadbalancer.healthcheck.path=/healthz"
    restart: unless-stopped

  platform-nats:
    image: docker.m.daocloud.io/library/nats:2.14.1
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:${PLATFORM_NATS_PORT:-4222}:4222"
      - "127.0.0.1:${PLATFORM_NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats_data:/data
    restart: always

  platform-nats-init:
    image: docker.m.daocloud.io/natsio/nats-box:0.18.0
    environment:
      - PLATFORM_EVENT_STREAM_NAME=${PLATFORM_EVENT_STREAM_NAME:-BYTE_V_FORGE_EVENTS}
    command:
      - sh
      - -ceu
      - |
        nats --server "$${PLATFORM_NATS_URL}" stream add "$${PLATFORM_EVENT_STREAM_NAME}" --subjects 'byte.v.forge.>' --storage file --retention limits --dupe-window 10m --defaults \
          || nats --server "$${PLATFORM_NATS_URL}" stream edit "$${PLATFORM_EVENT_STREAM_NAME}" --subjects 'byte.v.forge.>' --storage file --retention limits --dupe-window 10m --defaults
    depends_on:
      - platform-nats

  platform-db-migrations:
    image: docker.m.daocloud.io/library/postgres:15-alpine
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=${POSTGRES_DB:-byte_v_forge}
      - PGUSER=${POSTGRES_USER:-byte_v_forge}
      - PGPASSWORD=${POSTGRES_PASSWORD:-byte_v_forge}
    volumes:
      - ../sms/migrations:/migrations/sms:ro
      - ../wa-app/migrations:/migrations/wa-app:ro
      - ../mailbox/services/mailbox-api/migrations:/migrations/mailbox:ro
      - ../gpt/orchestrator/migrations:/migrations/gpt-orchestrator:ro
      - ../gpt/gpt-account/migrations:/migrations/gpt-account:ro
    command:
      - sh
      - -ceu
      - |
        for dir in /migrations/gpt-account /migrations/gpt-orchestrator /migrations/mailbox /migrations/sms /migrations/wa-app; do
          for file in "$${dir}"/*.sql; do
            [ -e "$${file}" ] || continue
            psql -v ON_ERROR_STOP=1 -f "$${file}"
          done
        done
    depends_on:
      - postgres

  n8n-main:
    image: docker.n8n.io/n8nio/n8n:2.21.7
    ports:
      - "127.0.0.1:${N8N_EDITOR_PORT:-5678}:5678"
    environment:
      <<: *n8n-environment
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      n8n-postgres:
        condition: service_started
      n8n-redis:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n-editor.rule=Host(`n8n.byte-v-forge.internal`)"
      - "traefik.http.routers.n8n-editor.entrypoints=web"
      - "traefik.http.routers.n8n-editor.priority=200"
      - "traefik.http.routers.n8n-editor.service=n8n-editor"
      - "traefik.http.services.n8n-editor.loadbalancer.server.port=5678"
      - "traefik.http.services.n8n-editor.loadbalancer.healthcheck.path=/healthz"
    restart: always

  n8n-worker:
    image: docker.n8n.io/n8nio/n8n:2.21.7
    command: ["worker", "--concurrency=5"]
    environment:
      <<: [*n8n-environment, *n8n-runner-environment]
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      n8n-postgres:
        condition: service_started
      n8n-redis:
        condition: service_started
    restart: always


  n8n-task-runner:
    image: docker.io/n8nio/runners:2.21.7
    environment: *n8n-task-runner-environment
    depends_on:
      n8n-worker:
        condition: service_started
    restart: always

  n8n-workflow-import:
    image: docker.n8n.io/n8nio/n8n:2.21.7
    environment: *n8n-environment
    volumes:
      - n8n_data:/home/node/.n8n
      - ../gpt/workflows/n8n:/workflow-sources/public:ro
      - ../gpt-private/workflows/n8n:/workflow-sources/private:ro
      - ../gopay-app/workflows/n8n:/workflow-sources/gopay:ro
      - ../wa-app/workflows/n8n:/workflow-sources/wa:ro
      - ./iac/helm/byte-v-forge/files/n8n-sync-workflow-folders.js:/opt/byte-v-forge/sync-workflow-folders.js:ro
    command:
      - sh
      - -ceu
      - |
        rm -rf /tmp/n8n-workflows
        mkdir -p /tmp/n8n-workflows
        for source in /workflow-sources/public /workflow-sources/private /workflow-sources/gopay /workflow-sources/wa; do
          [ -d "$$source" ] && cp -R "$$source"/. /tmp/n8n-workflows/
        done
        workflow_files() {
          find -L /tmp/n8n-workflows -path '*/..*' -prune -o -type f -name '*.workflow.json' -print | sort
        }
        for attempt in $$(seq 1 60); do
          if workflow_files | while read -r file; do
            n8n import:workflow --input="$$file" --activeState=fromJson
          done; then
            workflow_files | while read -r file; do
              id="$$(node -e "console.log(require(process.argv[1]).id)" "$$file")"
              [ -n "$$id" ] && n8n publish:workflow --id="$$id"
            done
            (cd /usr/local/lib/node_modules/n8n && node /opt/byte-v-forge/sync-workflow-folders.js /tmp/n8n-workflows)
            exit 0
          fi
          sleep 5
        done
        exit 1
    depends_on:
      n8n-main:
        condition: service_started
      n8n-postgres:
        condition: service_started
      n8n-redis:
        condition: service_started
    restart: "no"

  n8n-webhook:
    image: docker.n8n.io/n8nio/n8n:2.21.7
    command: ["webhook"]
    environment: *n8n-environment
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      n8n-postgres:
        condition: service_started
      n8n-redis:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n-webhook.rule=PathPrefix(`/webhook`) || PathPrefix(`/webhook-test`)"
      - "traefik.http.routers.n8n-webhook.entrypoints=webhook"
      - "traefik.http.routers.n8n-webhook.priority=200"
      - "traefik.http.routers.n8n-webhook.service=n8n-webhook"
      - "traefik.http.services.n8n-webhook.loadbalancer.server.port=5678"
      - "traefik.http.services.n8n-webhook.loadbalancer.healthcheck.path=/healthz"
    restart: always


  proxy-runtime:
    build:
      context: ../proxy-runtime
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${PROXY_RUNTIME_HTTP_PORT:-8083}:8080"
      - "${PROXY_RUNTIME_GATEWAY_PORT:-30081}:10810"
    environment:
      - PROXY_RUNTIME_ADDR=:8080
      - PROXY_RUNTIME_POSTGRES_DSN=host=postgres user=${POSTGRES_USER:-byte_v_forge} password=${POSTGRES_PASSWORD:-byte_v_forge} dbname=${POSTGRES_DB:-byte_v_forge} port=5432 sslmode=disable
      - PROXY_RUNTIME_DATA_DIR=/var/lib/proxy-runtime
      - PROXY_RUNTIME_MIHOMO_API_ADDR=${PROXY_RUNTIME_MIHOMO_API_ADDR:-127.0.0.1:18901}
      - PROXY_RUNTIME_ENCRYPTION_KEY=${PROXY_RUNTIME_ENCRYPTION_KEY:-byte_v_forge_proxy_runtime_encryption_key_change_me_32}
      - PROXY_RUNTIME_CONTROL_AUTH_TOKEN=${PROXY_RUNTIME_CONTROL_AUTH_TOKEN:-}
      - PROXY_RUNTIME_SERVICE_AUTH_TOKEN=${PROXY_RUNTIME_SERVICE_AUTH_TOKEN:-}
      - PROXY_RUNTIME_LOCAL_ADDR=:10810
      - PROXY_RUNTIME_LOCAL_PROTOCOL=${PROXY_RUNTIME_LOCAL_PROTOCOL:-socks5}
      - PROXY_RUNTIME_SESSION_ADVERTISED_HOST=${PROXY_RUNTIME_SESSION_ADVERTISED_HOST:-proxy-runtime}
      - PROXY_RUNTIME_REDIS_URL=${PROXY_RUNTIME_REDIS_URL:-redis://platform-redis:6379/0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - proxy_runtime_data:/var/lib/proxy-runtime
    depends_on:
      - postgres
      - platform-redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.proxy-runtime-status.rule=Host(`proxy-runtime.byte-v-forge.internal`)"
      - "traefik.http.routers.proxy-runtime-status.entrypoints=internal"
      - "traefik.http.routers.proxy-runtime-status.service=proxy-runtime"
      - "traefik.http.services.proxy-runtime.loadbalancer.server.port=8080"
      - "traefik.http.services.proxy-runtime.loadbalancer.healthcheck.path=/healthz"
      - "traefik.http.routers.proxy-runtime-api.rule=Host(`proxy-runtime.byte-v-forge.internal`) && PathPrefix(`/api`)"
      - "traefik.http.routers.proxy-runtime-api.entrypoints=web"
      - "traefik.http.routers.proxy-runtime-api.priority=200"
      - "traefik.http.routers.proxy-runtime-api.service=proxy-runtime"
      - "traefik.http.routers.proxy-runtime-ui.rule=Host(`proxy-runtime.byte-v-forge.internal`) && PathPrefix(`/`)"
      - "traefik.http.routers.proxy-runtime-ui.entrypoints=web"
      - "traefik.http.routers.proxy-runtime-ui.priority=100"
      - "traefik.http.routers.proxy-runtime-ui.service=proxy-runtime"
    restart: always

  browser-automation:
    build:
      context: ../browser-automation
      dockerfile: Dockerfile
      args:
        BROWSER_AUTOMATION_RUNTIME_IMAGE: ${BROWSER_AUTOMATION_RUNTIME_IMAGE:-browser-automation-runtime:camoufox-cloakbrowser-py3.12-bookworm}
    init: true
    ports:
      - "127.0.0.1:${BROWSER_AUTOMATION_GRPC_PORT:-50062}:50051"
      - "127.0.0.1:${BROWSER_AUTOMATION_HTTP_PORT:-50063}:8080"
      - "${BROWSER_AUTOMATION_WEBRTC_TCP_BIND:-127.0.0.1}:${BROWSER_AUTOMATION_WEBRTC_TCP_PORT:-3479}:3479/tcp"
      - "${BROWSER_AUTOMATION_WEBRTC_UDP_BIND:-127.0.0.1}:${BROWSER_AUTOMATION_WEBRTC_UDP_PORT:-3478}:3478/udp"
    environment:
      - BROWSER_AUTOMATION_LISTEN_ADDR=:50051
      - BROWSER_AUTOMATION_HTTP_LISTEN_ADDR=:8080
      - BROWSER_AUTOMATION_POSTGRES_DSN=host=postgres user=${POSTGRES_USER:-byte_v_forge} password=${POSTGRES_PASSWORD:-byte_v_forge} dbname=${POSTGRES_DB:-byte_v_forge} port=5432 sslmode=disable
      - BROWSER_AUTOMATION_APPLY_MIGRATIONS=${BROWSER_AUTOMATION_APPLY_MIGRATIONS:-true}
      - BROWSER_AUTOMATION_RUNTIME=${BROWSER_AUTOMATION_RUNTIME:-camoufox}
      - BROWSER_AUTOMATION_MAX_CONCURRENT_SESSIONS=${BROWSER_AUTOMATION_MAX_CONCURRENT_SESSIONS:-0}
      - BROWSER_AUTOMATION_WEBRTC_TCP_LISTEN_ADDR=:3479
      - BROWSER_AUTOMATION_WEBRTC_UDP_LISTEN_ADDR=:3478
      - BROWSER_AUTOMATION_WEBRTC_PUBLIC_IPS=${BROWSER_AUTOMATION_WEBRTC_PUBLIC_IPS:-127.0.0.1}
      - BROWSER_AUTOMATION_PROXY_REFS_JSON=${BROWSER_AUTOMATION_PROXY_REFS_JSON:-{}}
      - BROWSER_AUTOMATION_PROXY_RUNTIME_BASE_URL=${BROWSER_AUTOMATION_PROXY_RUNTIME_BASE_URL:-http://proxy-runtime:8080/api}
